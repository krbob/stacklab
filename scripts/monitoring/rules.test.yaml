rule_files:
  - ../../deploy/monitoring/stacklab.rules.yaml
evaluation_interval: 1m
tests:
  - name: Missing targets keep their host identity; brief restarts recover before firing
    interval: 1m
    input_series:
      - series: up{job="node-exporter",host="server"}
        values: '1 0 0 0 1 1'
      - series: up{job="cadvisor",host="server"}
        values: '1 0 1 1 1 1'
      - series: up{job="stacklab",host="different-server"}
        values: '1x5'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job="node-exporter",alertstate="firing"}
        eval_time: 2m
        exp_samples: []
      - expr: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job="node-exporter",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job="node-exporter",host="server",alertstate="firing",severity="critical",stacklab_monitoring="true"}
            value: 1
      - expr: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job=~"cadvisor|node-exporter",alertstate="firing"}
        eval_time: 5m
        exp_samples: []
      - expr: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job="stacklab",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: ALERTS{alertname="StacklabMonitoringTargetUnavailable",job="stacklab",host="server",alertstate="firing",severity="critical",stacklab_monitoring="true"}
            value: 1

  - name: Disk thresholds exclude virtual and read-only mounts and unsupported inodes
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '10x30'
      - series: node_filesystem_size_bytes{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '100x30'
      - series: node_filesystem_readonly{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '0x30'
      - series: node_filesystem_avail_bytes{job="node-exporter",host="server",mountpoint="/data",fstype="btrfs"}
        values: '3x30'
      - series: node_filesystem_size_bytes{job="node-exporter",host="server",mountpoint="/data",fstype="btrfs"}
        values: '100x30'
      - series: node_filesystem_readonly{job="node-exporter",host="server",mountpoint="/data",fstype="btrfs"}
        values: '0x30'
      - series: node_filesystem_files{job="node-exporter",host="server",mountpoint="/data",fstype="btrfs"}
        values: '0x30'
      - series: node_filesystem_files_free{job="node-exporter",host="server",mountpoint="/data",fstype="btrfs"}
        values: '0x30'
      - series: node_filesystem_avail_bytes{job="node-exporter",host="server",mountpoint="/run",fstype="tmpfs"}
        values: '1x30'
      - series: node_filesystem_size_bytes{job="node-exporter",host="server",mountpoint="/run",fstype="tmpfs"}
        values: '100x30'
      - series: node_filesystem_readonly{job="node-exporter",host="server",mountpoint="/run",fstype="tmpfs"}
        values: '0x30'
      - series: node_filesystem_avail_bytes{job="node-exporter",host="server",mountpoint="/archive",fstype="ext4"}
        values: '1x30'
      - series: node_filesystem_size_bytes{job="node-exporter",host="server",mountpoint="/archive",fstype="ext4"}
        values: '100x30'
      - series: node_filesystem_readonly{job="node-exporter",host="server",mountpoint="/archive",fstype="ext4"}
        values: '1x30'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabHostFilesystemSpaceLow",alertstate="firing"}
        eval_time: 29m
        exp_samples: []
      - expr: ALERTS{alertname="StacklabHostFilesystemSpaceLow",alertstate="firing"}
        eval_time: 30m
        exp_samples:
          - labels: ALERTS{alertname="StacklabHostFilesystemSpaceLow",job="node-exporter",host="server",mountpoint="/",fstype="ext4",alertstate="firing",severity="warning",stacklab_monitoring="true"}
            value: 1
      - expr: ALERTS{alertname="StacklabHostFilesystemSpaceCritical",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="StacklabHostFilesystemSpaceCritical",job="node-exporter",host="server",mountpoint="/data",fstype="btrfs",alertstate="firing",severity="critical",stacklab_monitoring="true"}
            value: 1
      - expr: ALERTS{alertname="StacklabHostInodesLow",alertstate="firing"}
        eval_time: 30m
        exp_samples: []

  - name: Temperatures respect hardware limits and ignore invalid firmware readings
    interval: 1m
    input_series:
      - series: node_hwmon_temp_celsius{job="node-exporter",host="server",chip="acpi",sensor="temp1"}
        values: '-263.2x15'
      - series: node_hwmon_temp_celsius{job="node-exporter",host="server",chip="cpu",sensor="temp1"}
        values: '90x15'
      - series: node_hwmon_temp_crit_celsius{job="node-exporter",host="server",chip="cpu",sensor="temp1"}
        values: '105x15'
      - series: node_hwmon_temp_celsius{job="node-exporter",host="server",chip="nvme",sensor="temp1"}
        values: '80x15'
      - series: node_hwmon_temp_crit_celsius{job="node-exporter",host="server",chip="nvme",sensor="temp1"}
        values: '87x15'
      - series: node_hwmon_temp_celsius{job="node-exporter",host="server",chip="unknown",sensor="temp1"}
        values: '50x15'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabHostTemperatureHigh",alertstate="firing"}
        eval_time: 9m
        exp_samples: []
      - expr: ALERTS{alertname="StacklabHostTemperatureHigh",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="StacklabHostTemperatureHigh",host="server",chip="cpu",alertstate="firing",severity="warning",stacklab_monitoring="true"}
            value: 1
          - labels: ALERTS{alertname="StacklabHostTemperatureHigh",host="server",chip="nvme",alertstate="firing",severity="warning",stacklab_monitoring="true"}
            value: 1

  - name: Resource pressure and application failures fire after their hold times
    interval: 1m
    input_series:
      - series: node_cpu_seconds_total{job="node-exporter",host="server",cpu="0",mode="idle"}
        values: '0+1x20'
      - series: node_memory_MemAvailable_bytes{job="node-exporter",host="server"}
        values: '5x20'
      - series: node_memory_MemTotal_bytes{job="node-exporter",host="server"}
        values: '100x20'
      - series: node_filesystem_files_free{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '5x20'
      - series: node_filesystem_files{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '100x20'
      - series: node_filesystem_readonly{job="node-exporter",host="server",mountpoint="/",fstype="ext4"}
        values: '0x20'
      - series: node_filesystem_readonly{job="node-exporter",host="readonly-server",mountpoint="/",fstype="ext4"}
        values: '1x20'
      - series: stacklab_ready{job="stacklab",host="server"}
        values: '1 0 0 0 1 1'
      - series: stacklab_http_errors_total{job="stacklab",host="server"}
        values: '0 0 1 1 1 1 1 1'
      - series: stacklab_jobs_errors_total{job="stacklab",host="server"}
        values: '0 0 1 1 1 1 1 1'
      - series: container_oom_events_total{job="cadvisor",host="server",name="app",image="app:1",container_label_com_docker_compose_project="apps"}
        values: '0 0 1 1 1 1 1 1'
      - series: container_oom_events_total{job="cadvisor",host="server",name="reset",image="app:1",container_label_com_docker_compose_project="apps"}
        values: '10 10 0 0 0 0 0 0'
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"StacklabHostCPUHigh|StacklabHostMemoryLow|StacklabHostInodesLow|StacklabHostRootFilesystemReadOnly",alertstate="firing"})
        eval_time: 16m
        exp_samples:
          - labels: '{}'
            value: 4
      - expr: ALERTS{alertname="StacklabNotReady",alertstate="firing"}
        eval_time: 2m
        exp_samples: []
      - expr: ALERTS{alertname="StacklabNotReady",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: ALERTS{alertname="StacklabNotReady",host="server",job="stacklab",alertstate="firing",severity="critical",stacklab_monitoring="true"}
            value: 1
      - expr: count(ALERTS{alertname=~"StacklabHTTPServerErrors|StacklabJobFailures|StacklabContainerOOM",alertstate="firing"})
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: ALERTS{alertname=~"StacklabNotReady|StacklabHTTPServerErrors|StacklabJobFailures|StacklabContainerOOM",alertstate="firing"}
        eval_time: 7m
        exp_samples: []

  - name: Old hardware totals and counter resets do not become new incidents
    interval: 1m
    input_series:
      - series: stacklab_pcie_errors_total{job="node-exporter",host="server",device="0000:01:00.0",severity="correctable"}
        values: '53051x10 0x20'
      - series: stacklab_pcie_errors_total{job="node-exporter",host="server",device="0000:01:00.0",severity="fatal"}
        values: '10x10 0x20'
      - series: stacklab_nvme_media_errors_total{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '10x30'
      - series: stacklab_btrfs_device_errors_total{job="node-exporter",host="server",filesystem="example",device_id="1",error="read"}
        values: '10x30'
      - series: stacklab_nvme_unsafe_shutdowns_total{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '12x30'
    promql_expr_test:
      - expr: ALERTS{alertname=~"StacklabPCIe.*|StacklabNVMe.*|StacklabBtrfs.*",alertstate="firing"}
        eval_time: 20m
        exp_samples: []

  - name: New hardware errors fire and combined PCIe severities remain one alert
    interval: 1m
    input_series:
      - series: stacklab_pcie_errors_total{job="node-exporter",host="server",device="0000:01:00.0",severity="nonfatal"}
        values: '0 0 1x20'
      - series: stacklab_pcie_errors_total{job="node-exporter",host="server",device="0000:01:00.0",severity="fatal"}
        values: '0 0 1x20'
      - series: stacklab_nvme_media_errors_total{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '0 0 1x20'
      - series: stacklab_btrfs_device_errors_total{job="node-exporter",host="server",filesystem="example",device_id="1",error="read"}
        values: '0 0 1x20'
      - series: node_vmstat_oom_kill{job="node-exporter",host="server"}
        values: '0 0 1x20'
      - series: node_edac_uncorrectable_errors_total{job="node-exporter",host="server",mc="0"}
        values: '0 0 1x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"StacklabPCIeUncorrectableErrors|StacklabNVMeMediaErrors|StacklabBtrfsDeviceErrors|StacklabHostOOM|StacklabHostECCErrors",alertstate="firing"})
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 5
      - expr: ALERTS{alertname=~"StacklabPCIeUncorrectableErrors|StacklabNVMeMediaErrors|StacklabBtrfsDeviceErrors|StacklabHostOOM|StacklabHostECCErrors",alertstate="firing"}
        eval_time: 20m
        exp_samples: []

  - name: Recurring corrected PCIe errors require the hold time
    interval: 1m
    input_series:
      - series: stacklab_pcie_errors_total{job="node-exporter",host="server",device="0000:01:00.0",severity="correctable"}
        values: '0+3x30'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabPCIeCorrectableErrors",alertstate="firing"}
        eval_time: 7m
        exp_samples: []
      - expr: count(ALERTS{alertname="StacklabPCIeCorrectableErrors",alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: Absent hardware output alerts only on explicitly enabled hosts
    interval: 1m
    input_series:
      - series: up{job="node-exporter",host="enabled",instance="enabled:9100",stacklab_hardware_monitoring="true"}
        values: '1x10'
      - series: up{job="node-exporter",host="not-enabled",instance="other:9100"}
        values: '1x10'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabHardwareCollectionStale",alertstate="firing"}
        eval_time: 1m
        exp_samples: []
      - expr: count by(host) (ALERTS{alertname="StacklabHardwareCollectionStale",alertstate="firing"})
        eval_time: 2m
        exp_samples:
          - labels: '{host="enabled"}'
            value: 1

  - name: Stale hardware output fires and fresh output clears it
    interval: 1m
    input_series:
      - series: up{job="node-exporter",host="server",instance="server:9100",stacklab_hardware_monitoring="true"}
        values: '1x30'
      - series: stacklab_hardware_collection_timestamp_seconds{job="node-exporter",host="server",instance="server:9100"}
        values: '0+60x4 240x10 900+60x10'
    promql_expr_test:
      - expr: ALERTS{alertname="StacklabHardwareCollectionStale",alertstate="firing"}
        eval_time: 5m
        exp_samples: []
      - expr: count(ALERTS{alertname="StacklabHardwareCollectionStale",alertstate="firing"})
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: ALERTS{alertname="StacklabHardwareCollectionStale",alertstate="firing"}
        eval_time: 19m
        exp_samples: []

  - name: NVMe health failures remain distinct from collection failures
    interval: 1m
    input_series:
      - series: stacklab_nvme_health_passed{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '0x20'
      - series: stacklab_nvme_critical_warning{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '8x20'
      - series: stacklab_nvme_available_spare_percent{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '5x20'
      - series: stacklab_nvme_available_spare_threshold_percent{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '10x20'
      - series: stacklab_nvme_percentage_used{job="node-exporter",host="server",device="/dev/nvme0"}
        values: '95x20'
      - series: stacklab_hardware_collector_success{job="node-exporter",host="server",collector="nvme"}
        values: '1x20'
      - series: stacklab_hardware_collector_success{job="node-exporter",host="broken-reader",collector="nvme"}
        values: '0x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"StacklabNVMeHealthCritical|StacklabNVMeSpareLow|StacklabNVMeWearHigh",alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: count by(host) (ALERTS{alertname="StacklabHardwareCollectionFailed",alertstate="firing"})
        eval_time: 2m
        exp_samples:
          - labels: '{host="broken-reader"}'
            value: 1
