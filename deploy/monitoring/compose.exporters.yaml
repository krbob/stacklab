# Merge into an existing monitoring stack; keep its Grafana/Prometheus volumes.
# Linux Docker Engine, with Prometheus on the existing `monitoring` network.
services:
  prometheus:
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${STACKLAB_METRICS_TOKEN_FILE:-/var/lib/stacklab/monitoring/metrics-token}
        target: /run/secrets/stacklab-metrics-token
        read_only: true
        bind:
          create_host_path: false

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --path.rootfs=/host
      - --web.listen-address=${MONITORING_HOST_GATEWAY:-172.17.0.1}:9100
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.diskstats
      - --collector.filesystem
      - --collector.hwmon
      - --collector.loadavg
      - --collector.meminfo
      - --collector.netdev
      - --collector.stat
      - --collector.time
      - --collector.uname
      - --collector.netdev.device-exclude=^(lo|veth.*|docker.*|br-.*)$$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker)($$|/)
    volumes:
      - /:/host:ro,rslave
    labels:
      - traefik.enable=false

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    restart: unless-stopped
    privileged: true
    pid: host
    command:
      - --docker_only=true
      - --disable_root_cgroup_stats=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network,diskIO,oom_event
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    labels:
      - traefik.enable=false
